name: build backend docker image
on:
  workflow_call:
    inputs:
      docker_username:
        description: 'DockerHub username'
        required: true
      docker_password:
        description: 'DockerHub password'
        required: true
      backend_version:
        description: 'Backend Docker image version'
        required: true
      frontend_version:
        description: 'Frontend Docker image version'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ inputs.docker_username }}
          password: ${{ inputs.docker_password }}

      - name: Build and push backendDocker image
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64,linux/arm64
          context: ./backend
          push: true
          tags: ${{ inputs.docker_username }}/task-management-platform:backend-${{ inputs.backend_version }}
      
      - name: Buiild and push frontend image
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64,linux/arm64
          context: ./frontend
          push: true
          tags: ${{ inputs.docker_username }}/task-management-platform:frontend-${{ inputs.frontend_version }}