apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-management-platform-ingress
  namespace: task-management-platform
  labels:
    app: task-management-platform
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: task-management-platform.local
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend
              port:
                number: 80