---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: backend-secret
  namespace: task-management-platform
spec:
  encryptedData:
    DB_PASSWORD: 
    JWT_SECRET: 
  template:
    metadata:
      labels:
        app: backend
      name: backend-secret
      namespace: task-management-platform
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-secret
  namespace: task-management-platform
spec:
  encryptedData:
    POSTGRES_PASSWORD: 
  template:
    metadata:
      labels:
        app: postgres
      name: postgres-secret
      namespace: task-management-platform
    type: Opaque
